services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    restart: unless-stopped

    working_dir: /var/www/html

    env_file:
      - .env
    environment:
      DB_ROOT_PASSWORD: ""

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - backend

  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - backend

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    user: "www-data"
    
    restart: unless-stopped

    working_dir: /var/www/html

    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90

    env_file:
      - .env
    environment:
      DB_ROOT_PASSWORD: ""  

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - backend

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    user: "www-data"
    
    restart: unless-stopped

    working_dir: /var/www/html

    command: php artisan schedule:work

    env_file:
      - .env
    environment:
      DB_ROOT_PASSWORD: ""  

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine

    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      app:
        condition: service_started

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - frontend
      - backend

networks:

  frontend:

  backend:
    internal: true

volumes:

  mysql_data:

  redis_data: