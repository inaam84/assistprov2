name: Feature Image - Manual Publish

on:
  push:
    branches-ignore:
      - main
      - develop

permissions:
  contents: read
  issues: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: laravel
          MYSQL_USER: laravel
          MYSQL_PASSWORD: laravel
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=30s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: laravel
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath, redis, zip
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: Run Laravel tests
        run: php artisan test

      - name: Build Docker image
        run: |
          docker build \
            --file docker/php/Dockerfile \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/assistpro:feature-${{ github.sha }} \
            .

      - name: Save Docker image
        run: |
          docker save \
            ${{ secrets.DOCKERHUB_USERNAME }}/assistpro:feature-${{ github.sha }} \
            --output assistpro-image.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: assistpro-image
          path: assistpro-image.tar
          retention-days: 1

  create-publish-request:
    needs: test-and-build
    runs-on: ubuntu-latest

    outputs:
      decision: ${{ steps.decision.outputs.decision }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create publish request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_URL=$(gh issue create \
            --title "🚀 Publish feature image: ${{ github.ref_name }}" \
            --body "## Feature image publish request

          **Branch:** \`${{ github.ref_name }}\`

          **Commit:** \`${{ github.sha }}\`

          **Docker image:**
          \`${{ secrets.DOCKERHUB_USERNAME }}/assistpro:feature-${{ github.sha }}\`

          ---

          Reply with:

          \`/publish\`

          to publish the image.

          Or:

          \`/cancel\`

          to cancel the request.

          ⏱️ This request will expire after 10 minutes."

          echo "issue_url=$ISSUE_URL" >> "$GITHUB_OUTPUT"

      - name: Wait for publish decision
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ steps.request.outputs.issue_url }}
        run: |
          echo "Waiting for /publish or /cancel..."
          echo "Issue: $ISSUE_URL"

          START_TIME=$(date +%s)
          TIMEOUT=600

          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))

            if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
              echo "No response received within 10 minutes."
              echo "Feature image will not be published."

              echo "decision=timeout" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            COMMENTS=$(gh issue view "$ISSUE_URL" --json comments)

            if echo "$COMMENTS" | grep -q '"/publish"'; then
              echo "Publish request received."

              echo "decision=publish" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if echo "$COMMENTS" | grep -q '"/cancel"'; then
              echo "Publish cancelled."

              echo "decision=cancel" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "No decision yet. Waiting 15 seconds..."
            sleep 15
          done

  publish-image:
    needs: create-publish-request
    if: needs.create-publish-request.outputs.decision == 'publish'
    runs-on: ubuntu-latest

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: assistpro-image

      - name: Load Docker image
        run: docker load --input assistpro-image.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/assistpro:feature-${{ github.sha }}