name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: laravel
          MYSQL_USER: laravel
          MYSQL_PASSWORD: laravel
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=30s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: laravel
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath, redis, zip
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: Run Laravel tests
        run: php artisan test

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --file docker/php/Dockerfile \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/assistpro:sha-${{ github.sha }} \
            .

      - name: Tag Docker image
        if: github.event_name == 'push'
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            docker tag \
              ${{ secrets.DOCKERHUB_USERNAME }}/assistpro:sha-${{ github.sha }} \
              ${{ secrets.DOCKERHUB_USERNAME }}/assistpro:latest
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            docker tag \
              ${{ secrets.DOCKERHUB_USERNAME }}/assistpro:sha-${{ github.sha }} \
              ${{ secrets.DOCKERHUB_USERNAME }}/assistpro:develop
          fi      

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/assistpro:sha-${{ github.sha }}

          if [ "${{ github.ref_name }}" = "main" ]; then
            docker push \
              ${{ secrets.DOCKERHUB_USERNAME }}/assistpro:latest
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            docker push \
              ${{ secrets.DOCKERHUB_USERNAME }}/assistpro:develop
          fi